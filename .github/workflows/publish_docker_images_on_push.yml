name: Build Docker Image On Push (Both Tags and Branches)

permissions:
  contents: read

concurrency:
  group: publish-docker-on-push-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  push:
    branches:
      - "**"

jobs:
  build_and_publish_images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image_type:
          - latest
          - alpine
          - postgres_17
          - postgres_16
          - nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: DockerHub Login
        env:
          DOCKERHUB_USER_NAME: ${{ secrets.DOCKERHUB_USER_NAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_USER_NAME}" --password-stdin

      - name: Build and publish docker images
        env:
          DOCKER_BUILD_MULTI_ARCH: ${{ github.ref == 'refs/heads/master' && '1' || '0' }}
          IMAGE_TYPE: ${{ matrix.image_type }}
        run: |
          python -m tools.packaging_automation.publish_docker \
            --github_ref "${GITHUB_REF}" \
            --pipeline_trigger_type "${GITHUB_EVENT_NAME}" \
            --image_type "${IMAGE_TYPE}"

  tag_release:
    needs: build_and_publish_images
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.tag.outputs.should_publish }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create release tag if missing
        id: tag
        run: |
          version=$(sed -n 's/^ARG VERSION=\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)[[:space:]]*$/\1/p' Dockerfile | head -n 1)
          [ -n "${version}" ] || { echo "::error::Could not parse ARG VERSION=X.Y.Z from Dockerfile"; exit 1; }
          tag="v${version}"
          existing_refs=$(git ls-remote --tags origin "refs/tags/${tag}" "refs/tags/${tag}^{}")
          if [ -n "${existing_refs}" ]; then
            tag_commit=$(printf '%s\n' "${existing_refs}" | awk '$2 ~ /\^\{\}$/ {c=$1} !c {c=$1} END {print c}')
            if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${tag} already exists at ${tag_commit}; skipping."
              echo "should_publish=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Tag ${tag} already points to ${GITHUB_SHA}; proceeding to versioned publish."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
            git push origin "refs/tags/${tag}"
          fi
          echo "should_publish=true" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${tag}" >> "${GITHUB_OUTPUT}"

  publish_tagged_images:
    needs: tag_release
    if: needs.tag_release.outputs.should_publish == 'true'
    uses: ./.github/workflows/publish_docker_images_on_tag.yml
    with:
      tag_name: ${{ needs.tag_release.outputs.tag_name }}
    secrets: inherit
