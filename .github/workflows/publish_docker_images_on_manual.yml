name: On Demand (Manual) Docker Image Build

on:
  workflow_dispatch:
    inputs:
      trigger_type:
        description: "Type of build to trigger"
        type: choice
        required: true
        options:
          - main
          - tags
          - nightly
      tag_name:
        description: "Tag name to release (required when trigger_type is 'tags')"
        type: string
        required: false
        default: ""

jobs:
  build_and_publish_images:
    name: Build and publish images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image_type: ${{ fromJSON(inputs.trigger_type == 'nightly' && '["nightly"]' || '["latest", "alpine", "postgres_17", "postgres_16", "nightly"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.trigger_type == 'tags' && '0' || '1' }}
          ref: ${{ inputs.trigger_type == 'tags' && 'master' || '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: DockerHub Login
        env:
          DOCKERHUB_USER_NAME: ${{ secrets.DOCKERHUB_USER_NAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_USER_NAME}" --password-stdin

      - name: Build and publish docker images
        env:
          DOCKER_BUILD_MULTI_ARCH: "1"
          TRIGGER_TYPE: ${{ inputs.trigger_type }}
          TAG_NAME: ${{ inputs.tag_name }}
          IMAGE_TYPE: ${{ matrix.image_type }}
        run: |
          target_ref="${GITHUB_REF}"
          if [ "${TRIGGER_TYPE}" = "tags" ]; then
            [[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Valid tag_name (vX.Y.Z) is required when trigger_type is 'tags'"; exit 1; }
            target_ref="refs/tags/${TAG_NAME}"
            git checkout --quiet "${target_ref}"
          elif [ "${TRIGGER_TYPE}" = "main" ] && [ -n "${TAG_NAME}" ]; then
            echo "::error::tag_name must be empty when trigger_type is 'main'"; exit 1
          fi
          python -m tools.packaging_automation.publish_docker \
            --pipeline_trigger_type "${GITHUB_EVENT_NAME}" \
            --tag_name "${TAG_NAME}" \
            --manual_trigger_type "${TRIGGER_TYPE}" \
            --github_ref "${target_ref}" \
            --image_type "${IMAGE_TYPE}"
