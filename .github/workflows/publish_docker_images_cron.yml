name: Schedule Build Docker Images For Main Images And Nightly

on:
  schedule:
    - cron: 30 0 * * *
  push:
    branches:
      - "**"

jobs:
  build_and_publish_images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image_type:
          - latest
          - alpine
          - postgres_17
          - postgres_16
          - nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: DockerHub Login
        env:
          DOCKERHUB_USER_NAME: ${{ secrets.DOCKERHUB_USER_NAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_USER_NAME}" --password-stdin

      - name: Build and publish docker images
        env:
          DOCKER_BUILD_MULTI_ARCH: ${{ github.ref == 'refs/heads/master' && '1' || '0' }}
          IMAGE_TYPE: ${{ matrix.image_type }}
        run: |
          python -m tools.packaging_automation.publish_docker \
            --pipeline_trigger_type "${GITHUB_EVENT_NAME}" \
            --github_ref "${GITHUB_REF}" \
            --image_type "${IMAGE_TYPE}"
