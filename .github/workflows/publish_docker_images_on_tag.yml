name: Build Docker Image On Tag Push

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag to build and publish (e.g. v14.3.0)"
        required: true
        type: string

jobs:
  build_and_publish_images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image_type:
          - latest
          - alpine
          - postgres_17
          - postgres_16
          - nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: DockerHub Login
        env:
          DOCKERHUB_USER_NAME: ${{ secrets.DOCKERHUB_USER_NAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_USER_NAME}" --password-stdin

      - name: Build and publish docker images
        env:
          DOCKER_BUILD_MULTI_ARCH: "1"
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          IMAGE_TYPE: ${{ matrix.image_type }}
        run: |
          if [ -n "${INPUT_TAG_NAME}" ]; then
            [[ "${INPUT_TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag_name '${INPUT_TAG_NAME}'"; exit 1; }
            target_ref="refs/tags/${INPUT_TAG_NAME}"
          else
            target_ref="${GITHUB_REF}"
          fi
          git checkout --quiet "${target_ref}"
          python -m tools.packaging_automation.publish_docker \
            --github_ref "${target_ref}" \
            --pipeline_trigger_type push \
            --image_type "${IMAGE_TYPE}"
